  <!-- envelope body -->
  <rect x="20" y="56" width="216" height="152" rx="22" fill="#C0392B"/>
  <!-- flap shadow and flap -->
  <path d="M20 86 L128 170 L236 86 V78 a22 22 0 0 0 -22 -22 H42 a22 22 0 0 0 -22 22 Z" fill="#8E2A1F"/>
  <path d="M20 78 L128 160 L236 78 a22 22 0 0 0 -22 -22 H42 a22 22 0 0 0 -22 22 Z" fill="#E74C3C"/>
  <!-- lower folds -->
  <g fill="none" stroke="#8E2A1F" stroke-width="7" stroke-linecap="round">
    <path d="M28 196 L104 140"/>
    <path d="M228 196 L152 140"/>
  </g>
  <!-- wax seal -->
